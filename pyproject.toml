[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fano"
version = "2.0.0"
description = "Research Project Assistant — multi-domain research platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    # HTTP client
    "aiohttp>=3.9.0",

    # Web framework
    "flask>=3.0.0",

    # Data validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.0.0",

    # Database
    "aiosqlite>=0.20.0",

    # Configuration
    "pyyaml>=6.0.0",

    # Utilities
    "python-ulid>=3.0.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.7.0",
    "markdown>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "aioresponses>=0.7.0",
]
research = [
    "tavily-python>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "shared*",
    "llm*",
    "explorer*",
    "documenter*",
    "control*",
    "researcher*",
    "orchestrator*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.html", "*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
